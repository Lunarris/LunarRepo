name: Update plugin versions

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-release]
  push:
    paths:
      - repo/pluginmaster.json
      - scripts/update_repo.py

permissions:
  contents: write

concurrency:
  group: update-repo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/update_repo.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git add -A repo README.md
          if ! git diff --cached --quiet; then
            git config user.name "repo-bot"
            git config user.email "repo-bot@users.noreply.github.com"
            git commit -m "Update plugin versions"
            git pull --rebase
            git push
          fi
